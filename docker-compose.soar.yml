name: ai-sec-soar
services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ "ollama_models:/root/.ollama" ]
    # раскомментируйте для GPU:
    # deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }
    restart: unless-stopped
    networks: [ secnet ]

  sanitizer:
    build: ./shared/sanitizer
    env_file: [ .env ]
    environment:
      AUDIT_LOG: /data/audit/sanitizer.log
    volumes: [ "audit:/data/audit" ]
    depends_on: [ ollama ]
    security_opt: [ "no-new-privileges:true" ]
    read_only: true
    tmpfs: [ /tmp ]
    networks: [ secnet ]

  soar:
    build: ./soar
    env_file: [ .env ]
    environment:
      SANITIZER_URL: http://sanitizer:8000
      AUDIT_LOG: /data/audit/soar.log
    volumes: [ "audit:/data/audit" ]
    depends_on: [ sanitizer ]
    security_opt: [ "no-new-privileges:true" ]
    ports: [ "127.0.0.1:8010:8010" ]   # только localhost
    networks: [ secnet ]

networks:
  secnet: { driver: bridge }
volumes:
  ollama_models: {}
  audit: {}
